<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>암호화 키 만들기</title>
<style>
  body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.6; background: #f6f7f9; color: #1d2330; }
  code { display: block; background: #fff; border: 1px solid #e3e6eb; border-radius: 8px; padding: 12px; font-size: 16px; word-break: break-all; }
  button { margin-top: 10px; padding: 8px 16px; border-radius: 6px; border: 1px solid #2f6fed; background: #2f6fed; color: #fff; cursor: pointer; font: inherit; }
  .warn { background: #fff6e0; border-radius: 8px; padding: 10px 12px; }
  @media (prefers-color-scheme: dark) { body { background: #14171c; color: #e6e8ec; } code { background: #1c2027; border-color: #2d333d; } .warn { background: #3a2f16; } }
</style>
</head>
<body>
<h1>DATA_KEY 만들기</h1>
<p>비밀번호를 암호화할 때 쓰는 키입니다. 이 페이지는 <b>내 브라우저 안에서만</b> 무작위 값을 만들고, 어디에도 보내지 않습니다.</p>
<code id="k"></code>
<button id="copy">복사</button> <button id="again">다시 만들기</button>
<p class="warn">⚠️ 이 값을 Cloudflare에 <b>DATA_KEY</b> 비밀로 등록한 뒤, 비밀번호 관리 앱 등 <b>안전한 곳에 따로 보관</b>하세요. 잃어버리면 저장된 비밀번호를 풀 수 없고, 공유 시트·메신저에는 올리지 마세요.</p>
<script>
  const make = () => { document.getElementById('k').textContent = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32)))); };
  document.getElementById('again').onclick = make;
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(document.getElementById('k').textContent).then(() => { document.getElementById('copy').textContent = '복사됨'; });
  make();
</script>
</body>
</html>
