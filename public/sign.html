<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4f46e5">
<title>회의록 전자서명</title>
<style>
  :root { --bg: #f4f5fb; --panel: #fff; --line: #e3e6f0; --text: #1c2233; --muted: #6b7286; --primary: #4f46e5; --soft: #eef0ff; --danger: #e5484d; --ok: #1f9d55; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11131a; --panel: #1a1d27; --line: #2c3040; --text: #eef0f6; --muted: #9aa1b5; --soft: #23264a; --primary: #8b85ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 16px 14px calc(60px + env(safe-area-inset-bottom)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--primary); }
  h1 { font-size: 20px; margin: 6px 0 2px; line-height: 1.35; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  input[type=password], input[type=tel], input[type=text] { width: 100%; font: inherit; font-size: 22px; letter-spacing: 6px; text-align: center; color: inherit; background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; }
  .btn { font: inherit; font-weight: 800; border: 0; border-radius: 12px; padding: 14px 18px; background: var(--primary); color: #fff; cursor: pointer; width: 100%; margin-top: 10px; }
  .btn.ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--line); width: auto; padding: 8px 14px; margin: 0; font-weight: 700; }
  .btn:disabled { opacity: .5; }
  .msg { margin-top: 10px; font-weight: 700; text-align: center; }
  .err { color: var(--danger); } .ok { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { border: 1px solid var(--line); padding: 8px; vertical-align: top; text-align: left; }
  th { background: var(--soft); white-space: nowrap; width: 84px; font-weight: 700; }
  .pre { white-space: pre-wrap; }
  .members { display: flex; flex-wrap: wrap; gap: 6px; }
  .members span { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
  .members span.done { background: #dff5e8; border-color: #b6e3c8; color: #157347; }
  .members span.me { outline: 2px solid var(--primary); }
  .pad { position: relative; border: 2px dashed var(--line); border-radius: 14px; background: #fff; touch-action: none; }
  .pad canvas { display: block; width: 100%; height: 200px; border-radius: 12px; }
  .pad .hint { position: absolute; inset: 0; display: grid; place-items: center; color: #b6bbc9; pointer-events: none; font-size: 15px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; margin-top: 8px; cursor: pointer; }
  .check input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--primary); }
  .sigimg { max-width: 240px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
  .done-box { text-align: center; }
  .done-box .big { font-size: 48px; }
  .small { font-size: 13px; }
  .mono { font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
</style>
</head>
<body>
<main id="app"><div class="card">불러오는 중…</div></main>
<script>
  // ✍️ 위원 서명 화면 (로그인 없음): 주소 #k=코드 → 비밀번호 → 회의록 확인 → 서명·동의.  #verify = PDF 위변조 확인
  const app = document.getElementById('app');
  const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (v == null || v === false) continue; if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'text') e.textContent = v; else e.setAttribute(k, v === true ? '' : v); } for (const k of kids.flat()) if (k != null && k !== false) e.append(k); return e; };
  const code = ((location.hash.match(/k=([A-Za-z0-9]{6})/) || [])[1] || '').toUpperCase();
  const H = { 'content-type': 'application/json', 'x-requested-with': 'gyomusil-pub' };
  const call = async (path, body) => { const r = await fetch(path, body ? { method: 'POST', headers: H, body: JSON.stringify(body) } : {}); const j = await r.json().catch(() => ({})); if (!r.ok) { const e = new Error(j.error || '오류가 났습니다.'); e.code = j.code; throw e; } return j; };
  // 접속 기기 (서명 확인 내역에 남김)
  const device = (() => { const u = navigator.userAgent; const os = /iPhone|iPad/.test(u) ? 'iPhone/iPad' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : '기타'; const br = /SamsungBrowser/.test(u) ? '삼성 인터넷' : /KAKAOTALK/i.test(u) ? '카카오톡' : /Whale/.test(u) ? '웨일' : /Edg\//.test(u) ? 'Edge' : /CriOS|Chrome/.test(u) ? 'Chrome' : /Safari/.test(u) ? 'Safari' : '브라우저'; return `${os} · ${br}`; })();
  let token = ''; let view = null;

  function head(info) {
    return el('div', { class: 'card' }, el('div', {}, info.committee ? el('span', { class: 'tag', text: info.committee }) : null),
      el('h1', { text: info.title || '회의록' }), el('div', { class: 'muted', text: info.school || '' }));
  }

  async function start() {
    if (/verify/.test(location.hash)) return verify();
    if (!code) { app.replaceChildren(el('div', { class: 'card err', text: '링크가 올바르지 않습니다. 담당자에게 다시 받아 주세요.' })); return; }
    let info;
    try { info = await call(`/pub/sign/${code}`); } catch (e) { app.replaceChildren(el('div', { class: 'card err', text: e.message })); return; }
    document.title = `${info.title} — 서명`;
    const pw = el('input', { type: 'tel', inputmode: 'numeric', maxlength: '6', autocomplete: 'one-time-code', placeholder: '••••••' });
    const msg = el('div', { class: 'msg' });
    const go = async () => {
      if (!/^\d{6}$/.test(pw.value.trim())) { msg.className = 'msg err'; msg.textContent = '6자리 숫자 비밀번호를 입력해 주세요.'; return; }
      btn.disabled = true;
      try { const r = await call(`/pub/sign/${code}/login`, { password: pw.value.trim(), device }); token = r.token; view = r; show(info); }
      catch (e) { msg.className = 'msg err'; msg.textContent = e.message; btn.disabled = false; }
    };
    pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    const btn = el('button', { class: 'btn', onclick: go, text: '확인' });
    app.replaceChildren(head(info),
      el('div', { class: 'card' }, el('h2', { text: `${info.name} ${info.role || '위원'}님` }),
        info.locked ? el('p', { class: 'err', text: '비밀번호를 여러 번 틀려 잠겼습니다. 담당자에게 재발급을 요청해 주세요.' }) : null,
        el('p', { class: 'muted', text: '담당자에게 받은 6자리 비밀번호를 입력하면 회의록을 확인하고 서명할 수 있습니다.' }), pw, btn, msg),
      el('p', { class: 'muted small', style: 'text-align:center', text: '본인 확인용 비밀번호입니다. 다른 사람에게 알려 주지 마세요.' }));
    setTimeout(() => pw.focus(), 50);
  }

  function doc(v) {
    const m = v.meeting;
    const row = (k, val, pre) => el('tr', {}, el('th', { text: k }), el('td', { class: pre ? 'pre' : '', text: val || '' }));
    return el('div', { class: 'card' }, el('h2', { text: '📄 회의록' }),
      el('table', {}, el('tbody', {}, row('일 시', m.datetime), row('장 소', m.place), row('안 건', m.agenda, true), row('회의 결과', m.result, true), row('확정일', m.confirmDate))),
      el('p', { class: 'muted small', text: '참석 위원' }),
      el('div', { class: 'members' }, v.members.map((x) => el('span', { class: `${x.signed ? 'done' : ''} ${x.me ? 'me' : ''}`, text: `${x.name}(${x.role || '위원'})${x.signed ? ' ✓' : ''}` }))));
  }

  function show(info) {
    const v = view;
    if (v.me.signedAt) {
      app.replaceChildren(head(info), el('div', { class: 'card done-box' }, el('div', { class: 'big', text: '✅' }), el('h2', { text: '서명을 마쳤습니다' }),
        el('p', { class: 'muted', text: `${v.me.signedAt} 서명 · 내용 확인·동의, 전자서명 사용 동의` }), v.me.signature ? el('img', { class: 'sigimg', src: v.me.signature, alt: '내 서명' }) : null,
        el('p', { class: 'muted small', text: v.meeting.status === 'closed' ? '모든 위원 서명이 끝나 회의록이 마감되었습니다.' : '다른 위원의 서명을 기다리는 중입니다. 이 창은 닫아도 됩니다.' })), doc(v));
      return;
    }
    if (v.meeting.status !== 'open') { app.replaceChildren(head(info), el('div', { class: 'card', text: '서명이 마감된 회의록입니다. 담당자에게 문의해 주세요.' }), doc(v)); return; }
    // 서명 패드
    const canvas = el('canvas'); const hint = el('div', { class: 'hint', text: '여기에 손가락으로 서명해 주세요' });
    const pad = el('div', { class: 'pad' }, canvas, hint);
    let ctx; let drawing = false; let ink = 0; let last = null;
    const fit = () => { const r = canvas.getBoundingClientRect(); const dpr = Math.max(1, window.devicePixelRatio || 1); canvas.width = r.width * dpr; canvas.height = r.height * dpr; ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ink = 0; hint.style.display = ''; };
    const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    canvas.addEventListener('pointerdown', (e) => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); hint.style.display = 'none'; e.preventDefault(); });
    canvas.addEventListener('pointermove', (e) => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ink += Math.hypot(p.x - last.x, p.y - last.y); last = p; e.preventDefault(); });
    const end = () => { drawing = false; }; canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
    const c1 = el('input', { type: 'checkbox' }); const c2 = el('input', { type: 'checkbox' });
    const msg = el('div', { class: 'msg' });
    const submit = async () => {
      if (ink < 60) { msg.className = 'msg err'; msg.textContent = '서명을 해 주세요.'; return; }
      if (!c1.checked || !c2.checked) { msg.className = 'msg err'; msg.textContent = '두 가지 동의에 모두 체크해 주세요.'; return; }
      // 서명 이미지를 가로 600px 이하로 줄여 보냄
      const out = document.createElement('canvas'); const w = Math.min(600, canvas.width); out.width = w; out.height = Math.round(canvas.height * (w / canvas.width));
      const o = out.getContext('2d'); o.drawImage(canvas, 0, 0, out.width, out.height);
      btn.disabled = true; msg.className = 'msg'; msg.textContent = '보내는 중…';
      try { view = await call(`/pub/sign/${code}/sign`, { token, signature: out.toDataURL('image/png'), docHash: v.docHash, consent: true, consentEsign: true, device }); show(info); }
      catch (e) {
        btn.disabled = false; msg.className = 'msg err'; msg.textContent = e.message;
        if (e.code === 'AUTH' || e.code === 'CHANGED') setTimeout(start, 1800);
      }
    };
    const btn = el('button', { class: 'btn', onclick: submit, text: '서명하고 동의하기' });
    app.replaceChildren(head(info), doc(v),
      el('div', { class: 'card' }, el('h2', { text: `✍️ ${v.me.name} ${v.me.role || '위원'}님 서명` }),
        el('p', { class: 'muted small', text: '위 회의록을 끝까지 확인한 뒤 아래 칸에 서명해 주세요.' }), pad,
        el('div', { class: 'row' }, el('span', { class: 'muted small', style: 'flex:1', text: '휴대폰을 가로로 돌리면 넓게 쓸 수 있어요.' }), el('button', { class: 'btn ghost', onclick: () => fit(), text: '다시 쓰기' })),
        el('label', { class: 'check' }, c1, el('span', { text: '위 회의록의 내용을 확인했으며, 그 내용에 동의합니다.' })),
        el('label', { class: 'check' }, c2, el('span', { text: '이 서명을 전자서명으로 사용하는 것에 동의합니다. (「전자서명법」 제3조)' })),
        btn, msg));
    fit(); window.addEventListener('resize', () => { if (!ink) fit(); });
  }

  // PDF 위변조 확인
  function verify() {
    document.title = '회의록 PDF 위변조 확인';
    const out = el('div');
    const file = el('input', { type: 'file', accept: 'application/pdf,.pdf' });
    file.addEventListener('change', async () => {
      const f = file.files[0]; if (!f) return;
      out.replaceChildren(el('p', { class: 'muted', text: '확인하는 중…' }));
      try {
        const buf = await crypto.subtle.digest('SHA-256', await f.arrayBuffer());
        const sha = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
        const r = await call(`/pub/sign-verify/${sha}`);
        out.replaceChildren(r.match
          ? el('div', { class: 'card' }, el('h2', { class: 'ok', text: `✅ 원본과 일치합니다${r.purged ? ' · 클라우드 데이터 파기됨' : ''}` }), el('p', { text: `${r.title} · ${r.school || ''}` }), el('p', { class: 'muted', text: `확정일 ${r.confirmDate || ''} · 원본 등록 ${String(r.createdAt).slice(0, 16)}` }),
            el('p', { class: 'small', text: `서명: ${(r.signers || []).map((s) => `${s.name}${s.signedAt ? `(${String(s.signedAt).slice(5, 16)})` : '(미서명)'}`).join(', ')}` }))
          : el('div', { class: 'card' }, el('h2', { class: 'err', text: '❌ 등록된 원본과 다릅니다' }), el('p', { class: 'muted', text: '파일이 바뀌었거나, 원본 등록 없이(인쇄 창의 PDF로 저장 등) 만든 파일입니다.' })),
          el('p', { class: 'muted small mono', text: `파일 확인값 ${sha}` }));
      } catch (e) { out.replaceChildren(el('p', { class: 'err', text: e.message })); }
    });
    app.replaceChildren(el('div', { class: 'card' }, el('h1', { text: '🔍 회의록 PDF 위변조 확인' }), el('p', { class: 'muted', text: '보관한 회의록 PDF를 고르세요. 파일은 서버로 보내지 않고, 이 기기에서 계산한 확인값만 비교합니다.' }), file), out);
  }
  start();
  window.addEventListener('hashchange', start);
</script>
</body>
</html>
