<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <script>
    // 화면 깜빡임 없이 저장된 테마 먼저 적용 (기본: 밝게)
    try { var t = JSON.parse(localStorage.getItem('gy_theme') || '{}'); var d = t.mode === 'dark' || (t.mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light'; document.documentElement.dataset.accent = t.accent || 'indigo'; } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OnlineFlatform">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="robots" content="noindex, nofollow">
  <title>OnlineFlatform</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div id="app"><div class="center-box"><p class="muted">불러오는 중…</p></div></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
