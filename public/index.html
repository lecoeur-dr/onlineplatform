<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <script>
    // 화면 깜빡임 없이 저장된 테마 먼저 적용 (기본: 밝게)
    try { var t = JSON.parse(localStorage.getItem('gy_theme') || '{}'); var d = t.mode === 'dark' || (t.mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light'; document.documentElement.dataset.accent = t.accent || 'indigo'; } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OnlinePlatform">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="robots" content="noindex, nofollow">
  <title>OnlinePlatform</title>
  <meta name="description" content="학교 업무(온라인 교무실)와 Deskterior(내 학급·수업·기록)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OnlinePlatform">
  <meta property="og:title" content="OnlinePlatform">
  <meta property="og:description" content="학교 업무(온라인 교무실)와 Deskterior(내 학급·수업·기록)">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div id="app"><div class="center-box"><p class="muted">불러오는 중…</p></div></div>
  <script>
    // 시작 감시: 화면 파일(js) 오류로 '불러오는 중'에서 멈추면 원인과 복구 버튼을 보여 줌 (브라우저·확장 프로그램·오래된 저장본 문제 진단용)
    (function () {
      var errs = [];
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) errs.push(/pretendard/.test(t.href || '') ? '(글꼴을 받지 못함 — 화면에는 영향 없음)' : '파일을 받지 못함: ' + (t.src || t.href).replace(location.origin, ''));
        else if (e.message) errs.push(e.message + (e.filename ? ' (' + e.filename.replace(location.origin, '') + ':' + e.lineno + ')' : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) { errs.push('처리 안 된 오류: ' + (e.reason && e.reason.message || e.reason)); });
      window.__gyReset = function () {
        var jobs = [];
        try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (x) {}
        try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (x) {}
        Promise.all(jobs).catch(function () {}).then(function () { location.replace('/?r=' + Date.now() + location.hash); });
      };
      setTimeout(function () {
        if (window.__gyBooted) return;
        var box = document.getElementById('app');
        var esc = function (s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
        box.innerHTML = '<div class="center-box"><div class="login" style="max-width:560px;text-align:left">'
          + '<h2>화면을 불러오지 못했습니다</h2>'
          + '<p>아래 [저장본 지우고 다시 열기]를 먼저 눌러 보세요. 그래도 같으면 이 화면을 캡처해 관리자에게 보내 주세요.</p>'
          + '<p><button class="btn primary" onclick="__gyReset()">저장본 지우고 다시 열기</button> <button class="btn" onclick="location.reload()">새로고침</button></p>'
          + '<pre style="white-space:pre-wrap;font-size:12px;background:#f3f4f6;padding:10px;border-radius:8px;color:#111">'
          + esc((errs.length ? errs.join('\n') : '오류 메시지 없음 (파일을 받는 중 멈춤 — 네트워크·보안 프로그램·브라우저 확장 프로그램 확인)') + '\n\n브라우저: ' + navigator.userAgent)
          + '</pre></div></div>';
      }, 8000);
    })();
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
