name = "onlineplatform"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/pub/*"]

# ⚡ 서버 코드를 데이터베이스(D1) 가까운 곳에서 실행 → DB에 묻는 왕복 시간이 짧아짐
#   (Cloudflare가 실제 요청을 보고 자리를 정하므로 적용까지 시간이 조금 걸릴 수 있음)
[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "gyomusil"
database_id = "55c2d36e-4502-4d8e-9f15-9dab906d1e57"
migrations_dir = "migrations"

# 매일 05:00(한국 시간) 나이스 학사일정 자동 동기화
[triggers]
crons = ["0 20 * * *"]

[vars]
SCHOOL_NAME = "서부초등학교"
# 아래 4개는 Cloudflare 대시보드의 '변수 및 비밀'에 '비밀(Secret)'로 등록 (docs/02_배포_가이드.md)
#   ADMIN_EMAILS         관리자 Gmail (쉼표로 여러 명). 이 주소로 로그인하면 항상 관리자
#   GOOGLE_CLIENT_ID     구글 로그인 클라이언트 ID
#   GOOGLE_CLIENT_SECRET 구글 로그인 클라이언트 보안 비밀번호
#   DATA_KEY             비밀번호 암호화 키 (/keygen.html 에서 생성)
#   NEIS_API_KEY         나이스 교육정보 개방포털 인증키 (학사일정·급식)
